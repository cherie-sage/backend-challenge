services:
  app:
    # Microsoft's dev container image: Python 3.12 plus git, curl, gh and the
    # other tools a development environment is expected to have. The plain
    # python:3.12-slim image has none of them.
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/backend-challenge:cached
    command: sleep infinity
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=challenge
      - POSTGRES_USER=challenge
      - POSTGRES_PASSWORD=challenge
      - DJANGO_SECRET_KEY=dev-secret-key-not-for-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=challenge
      - POSTGRES_USER=challenge
      - POSTGRES_PASSWORD=challenge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
